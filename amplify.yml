version: 1
frontend:
  phases:
    preBuild:
      commands:
        - "npm ci --cache .npm --prefer-offline"
        - 'echo "Node version: $(node -v)"'
        - 'echo "NPM version: $(npm -v)"'
        - 'echo "AWS_ACCESS_KEY_ID=$DB_ACCESS_KEY_ID" >> .env.production'
        - 'echo "AWS_SECRET_ACCESS_KEY=$DB_SECRET_ACCESS_KEY" >> .env.production'
        - 'echo "AWS_REGION=ap-northeast-1" >> .env.production'
        - 'echo "GOOGLE_API_KEY=$GOOGLE_API_KEY" >> .env.production'
    build:
      commands:
        - 'echo "Starting build process..."'
        - "NEXT_PUBLIC_ESLINT_DISABLED=true npm run build --verbose"
        - 'echo "Build completed"'
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
    discard-paths: false
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
  customHeaders:
    - pattern: "**/*"
      headers:
        - key: "Cache-Control"
          value: "public, max-age=0, must-revalidate"
